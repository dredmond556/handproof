<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handproof</title>
<meta name="description" content="Handproof keeps the record of how writing, art, photos, music and films were made, so anyone can see the process instead of trusting a detector’s score.">
<meta name="theme-color" content="#ffffff">
<meta property="og:type" content="website">
<meta property="og:title" content="Handproof: proof that a person made it">
<meta property="og:description" content="Write in Handproof and the revision history is recorded. Readers can replay how the piece came together.">
<meta name="twitter:card" content="summary">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Handproof">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  /* Revision colors follow the order film scripts use for revision pages:
     white, blue, pink, yellow, green, goldenrod, buff, salmon, cherry. */
  :root{
    --white:#fff; --ink:#1E2024; --stone:#62656D; --line:#E2E3E7; --surface:#F6F6F7;
    --blue:#D9E8F8; --blue-ink:#3F7FC4;
    --pink:#FADCE5; --pink-ink:#CF5C83;
    --yellow:#FCF2BC; --yellow-ink:#B89B14;
    --green:#DAEED2; --green-ink:#4A9638;
    --gold:#F4DC96; --buff:#EDE0C3; --salmon:#F9CDBB;
    --flag:#B3263A; --flag-bg:#FBE4E7; --good:#1F7A4D; --good-bg:#DDF1E5;
    --sans:'Archivo',system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --script:'Courier Prime','Courier New',Courier,monospace;
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0; background:var(--white); color:var(--ink); font-family:var(--sans); font-size:17px; line-height:1.6; -webkit-font-smoothing:antialiased;}
  a{color:inherit;}
  :focus-visible{outline:3px solid var(--blue-ink); outline-offset:2px;}
  .wrap{max-width:1120px; margin:0 auto; padding:0 24px;}
  .narrow{max-width:820px;}
  p{margin:0 0 14px; max-width:62ch;}
  h1,h2,h3{font-weight:800; font-stretch:112%; letter-spacing:-.02em; line-height:1.05; margin:0; text-wrap:balance;}
  h1{font-size:clamp(34px,5.4vw,60px); margin:44px 0 18px;}
  h2{font-size:clamp(26px,3.6vw,38px); margin:0 0 18px;}
  h3{font-size:20px; letter-spacing:-.01em;}
  .muted{color:var(--stone);}
  .sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;}

  /* top bar */
  .top{border-bottom:1px solid var(--line); background:var(--white); position:sticky; top:0; z-index:5;}
  .top .wrap{display:flex; align-items:center; justify-content:space-between; height:64px;}
  .brand{display:flex; align-items:center; gap:10px; text-decoration:none; font-weight:800; font-stretch:112%; font-size:19px; letter-spacing:-.02em;}
  .top nav{display:flex; align-items:center; gap:6px;}
  .top nav a{white-space:nowrap; text-decoration:none; font-weight:500; font-size:15px; padding:8px 12px; border-bottom:2px solid transparent;}
  .top nav a:hover{background:var(--surface); border-radius:6px;}
  .top nav a[aria-current="page"]{border-bottom-color:var(--ink); border-radius:0;}
  .top nav a.btn{margin-left:8px; border-bottom:0;}

  /* controls */
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; font:inherit; font-weight:600; font-size:15px; padding:11px 18px; border-radius:8px; border:1.5px solid var(--ink); background:var(--white); color:var(--ink); text-decoration:none; cursor:pointer; line-height:1.2;}
  .btn:hover{background:var(--surface);}
  .btn.primary{background:var(--ink); color:var(--white);}
  .btn.primary:hover{background:#000;}
  .btn:disabled{opacity:.4; cursor:not-allowed;}
  .top nav a.btn.primary:hover{background:#000;}
  .linkbtn{font:inherit; font-size:14px; background:none; border:none; padding:4px 0; color:var(--ink); text-decoration:underline; text-underline-offset:3px; cursor:pointer;}
  .linkbtn.danger{color:var(--flag);}
  input[type=text], input[type=search], input[type=email], input[type=password], textarea, select{font:inherit; color:var(--ink); background:var(--white); border:1.5px solid #C4C6CD; border-radius:8px; padding:10px 12px;}
  input:focus, textarea:focus, select:focus{outline:none; border-color:var(--ink); box-shadow:0 0 0 3px rgba(63,127,196,.35);}
  label{display:block; font-weight:600; font-size:15px; margin:22px 0 6px;}
  label.inline{display:inline; margin:0 8px 0 0; font-weight:500;}

  .chip{display:inline-block; font-size:13px; font-weight:600; line-height:1; padding:6px 10px; border-radius:99px; background:var(--surface); color:var(--stone); white-space:nowrap;}
  .chip.good{background:var(--good-bg); color:var(--good);}
  .chip.flag{background:var(--flag-bg); color:var(--flag);}
  .chip.blue{background:var(--blue); color:#23527f;}
  .chip.pink{background:var(--pink); color:#8e3555;}
  .chip.yellow{background:var(--yellow); color:#6e5d05;}

  /* hero */
  .hero h1{font-size:clamp(42px,8.2vw,104px); margin:56px 0 22px; line-height:.98; max-width:11em;}
  .lede{font-size:clamp(18px,2vw,21px); line-height:1.5; max-width:54ch; margin-bottom:26px;}
  .cta-row{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:56px;}
  .legend{display:flex; flex-wrap:wrap; gap:8px 26px; margin:14px 0 0; padding:0; list-style:none; font-size:14px; color:var(--stone);}
  .legend li{display:flex; align-items:center; gap:8px; margin:0;}
  .sw{width:22px; height:12px; border-radius:2px; display:inline-block; border:1px solid rgba(0,0,0,.2);}
  .sw.line{height:0; border:0; border-top:2px solid var(--ink); border-radius:0;}
  .sw.mark{width:3px; height:14px; background:var(--flag); border:0;}

  section.block{padding-top:96px;}

  /* replay */
  .replay{border:1.5px solid var(--ink); border-radius:12px; overflow:hidden; background:var(--white);}
  .rp-bar{display:flex; align-items:center; gap:14px; padding:10px 14px; border-bottom:1px solid var(--line);}
  .rp-bar .lbl{font-size:14px; color:var(--stone); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .rp-play{display:inline-flex; align-items:center; gap:8px; font:inherit; font-weight:600; font-size:14px; background:var(--ink); color:#fff; border:0; border-radius:99px; padding:8px 16px 8px 13px; cursor:pointer; min-width:92px;}
  .rp-play:hover{background:#000;}
  .chart-plot{position:relative; height:170px; touch-action:pan-y; cursor:col-resize; background:var(--white);}
  .chart-plot:focus-visible{outline-offset:-3px;}
  .chart-plot svg{width:100%; height:100%; display:block;}
  .chart-plot .ymax{position:absolute; left:10px; top:8px; font-size:12px; color:var(--stone); background:rgba(255,255,255,.85); padding:1px 6px; border-radius:4px; pointer-events:none;}
  .chart-axis{display:flex; justify-content:space-between; font-size:12px; color:var(--stone); padding:5px 12px 0; font-variant-numeric:tabular-nums;}
  .trace{fill:none; stroke:var(--ink); stroke-width:2; vector-effect:non-scaling-stroke; stroke-linejoin:round;}
  .pastemark{stroke:var(--flag); stroke-width:3; vector-effect:non-scaling-stroke;}
  .head{stroke:var(--ink); stroke-width:2; vector-effect:non-scaling-stroke;}
  .stack{display:flex; gap:2px; padding:12px 14px 4px;}
  .stack .tab{flex:1 1 0; min-width:4px; max-width:44px; height:26px; border:0; padding:0; background:none; position:relative; cursor:pointer;}
  .stack .tab::before{content:""; position:absolute; left:0; right:0; top:9px; height:8px; border-radius:3px; background:var(--bg); box-shadow:inset 0 0 0 1px var(--ink); transition:top .12s, height .12s, background-color .12s;}
  .stack .tab:hover::before{top:7px; height:12px;}
  .stack .tab.on::before{top:5px; height:16px; background:var(--ink); box-shadow:none;}
  .stack .tab.p::after{content:""; position:absolute; left:50%; top:-3px; width:5px; height:5px; margin-left:-2.5px; border-radius:50%; background:var(--flag);}
  .rp-note{padding:9px 14px; background:var(--flag-bg); color:var(--flag); font-size:14px; font-weight:500; border-top:1px solid #f1c3c9;}
  .page{border-top:1.5px solid var(--ink);}
  .page-head{display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:10px 20px; font-size:14px; border-bottom:1px solid rgba(0,0,0,.12);}
  .page-head .rev-name{font-weight:700;}
  .page-head .rp-info{color:#44474e; font-variant-numeric:tabular-nums;}
  .rp-text{padding:22px 24px 28px; font:16px/1.75 var(--script); white-space:pre-wrap; min-height:140px; overflow-wrap:anywhere; max-width:72ch;}
  .rp-text .empty{color:#6b6e75; font-style:italic;}

  /* crafts */
  .crafts{display:grid; grid-template-columns:260px 1fr; gap:28px; align-items:start; margin-top:30px;}
  .craft-tabs{display:flex; flex-direction:column; gap:8px;}
  .craft-tab{font:inherit; text-align:left; background:var(--white); border:1.5px solid var(--line); border-left-width:6px; border-radius:8px; padding:14px 16px; cursor:pointer;}
  .craft-tab strong{display:block; font-size:18px; font-weight:700;}
  .craft-tab span{font-size:14px; color:var(--stone);}
  .craft-tab:hover{background:var(--surface);}
  .craft-tab[aria-selected="true"]{border-color:var(--ink); background:var(--tint);}
  .craft-tab[data-craft="writing"]{--tint:var(--yellow); border-left-color:var(--yellow-ink);}
  .craft-tab[data-craft="acting"]{--tint:var(--pink); border-left-color:var(--pink-ink);}
  .craft-tab[data-craft="film"]{--tint:var(--green); border-left-color:var(--green-ink);}
  .craft-panel{border:1.5px solid var(--ink); border-radius:12px; padding:28px; min-height:420px;}
  .craft-panel h3{font-size:28px; margin:12px 0 12px; font-stretch:108%;}
  .craft-panel ul{margin:0 0 16px; padding-left:20px;}
  .craft-panel li{margin-bottom:5px;}
  .craft-panel .limit{font-size:15px; color:var(--stone); border-left:3px solid var(--line); padding-left:12px;}
  .preview{margin:18px 0 18px; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--white);}
  .preview .spark{height:110px;}
  .preview-cap{padding:8px 12px; font-size:13px; color:var(--stone); border-top:1px solid var(--line);}
  .take{display:grid; grid-template-columns:14px 1fr auto; gap:14px; align-items:center; padding:12px 14px; border-top:1px solid var(--line);}
  .take:first-child{border-top:0;}
  .take i{display:block; height:30px; border-radius:2px 2px 0 0; border-bottom:3px solid;}
  .take b{display:block; font-weight:700; line-height:1.2;}
  .take small{font-size:13px; color:var(--stone);}
  .prompt{margin:0; padding:12px 14px; background:var(--pink); font-size:14.5px; max-width:none; display:flex; gap:10px; justify-content:space-between; flex-wrap:wrap; align-items:center;}
  .mix{display:flex; height:16px; border-radius:99px; overflow:hidden; margin:14px;}
  .mix span{display:block;}

  .two{display:grid; grid-template-columns:1fr 1fr; gap:40px; margin-top:24px;}
  .two ul{margin:12px 0 0; padding-left:20px; max-width:50ch;}
  .two li{margin-bottom:8px;}
  .band{background:var(--blue); border-radius:16px; padding:56px 40px; margin-top:96px;}
  .band h2{max-width:20ch; font-size:clamp(28px,4.4vw,48px);}

  /* editor */
  .title-input{width:100%; font-size:24px; font-weight:700; font-stretch:106%;}
  textarea.draft{width:100%; min-height:340px; font:17px/1.75 var(--script); padding:18px 20px; resize:vertical; border-radius:10px;}
  .notice{background:var(--yellow); border-radius:8px; padding:10px 14px; font-size:15px; margin:0 0 6px; max-width:none;}
  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:10px; overflow:hidden; margin:18px 0;}
  .stat{background:var(--white); padding:14px 16px;}
  .stat b{display:block; font-size:26px; font-weight:700; letter-spacing:-.01em; font-variant-numeric:tabular-nums; line-height:1.15;}
  .stat b.bad{color:var(--flag);}
  .stat span{font-size:14px; color:var(--stone);}
  .actions{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:22px 0 70px;}
  .byline{color:var(--stone); margin:0 0 6px;}
  .pf-bio{white-space:pre-wrap; max-width:62ch; font-size:18px; line-height:1.65; margin:0 0 18px;}
  .pf-line{margin:0 0 6px; overflow-wrap:anywhere;}
  .pf-line .muted{display:inline-block; min-width:76px;}
  textarea.bio-in{width:100%; max-width:560px; min-height:110px; resize:vertical; line-height:1.55;}
  .small-note{font-size:14px; margin:6px 0 14px;}
  .chip.green{background:var(--green); color:#2f6a22;}
  button.chip{font-family:inherit; border:0; cursor:pointer;}
  .kind-filters{display:contents;}
  .kinds{border:0; padding:0; margin:20px 0 0; display:flex; flex-wrap:wrap; gap:10px;}
  .kinds legend{font-weight:600; font-size:15px; margin-bottom:8px; padding:0;}
  .kind{margin:0; font-weight:600; display:flex; align-items:center; gap:8px; border:1.5px solid var(--line); border-radius:10px; padding:12px 16px; cursor:pointer;}
  .kind:has(input:checked){border-color:var(--ink); background:var(--surface);}
  .wk-thumb{height:150px; background:var(--surface); border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:center; overflow:hidden; color:var(--stone); font-weight:700; font-stretch:112%; font-size:20px;}
  .wk-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .work-main{margin:18px 0 8px;}
  .work-fig{margin:0 0 16px;}
  .work-fig figcaption{color:var(--stone); font-size:15px; margin-bottom:6px;}
  .work-img{max-width:100%; max-height:80vh; height:auto; display:block; border:1px solid var(--line); border-radius:8px;}
  .work-vid{max-width:100%; max-height:80vh; display:block; border-radius:8px; background:#000;}
  .work-fig audio{width:100%; max-width:560px;}
  .row-thumb{width:48px; height:48px; object-fit:cover; border-radius:6px; border:1px solid var(--line);}
  .craft-tab[data-craft="art"]{--tint:var(--pink); border-left-color:var(--pink-ink);}
  .craft-tab[data-craft="photo"]{--tint:var(--blue); border-left-color:var(--blue-ink);}
  .craft-tab[data-craft="music"]{--tint:var(--yellow); border-left-color:var(--yellow-ink);}
  .banner{display:block; padding:12px 16px; border-radius:8px; font-weight:500; margin:0 0 16px; max-width:none;}
  .banner.good{background:var(--good-bg); color:var(--good);}
  .banner.bad{background:var(--flag-bg); color:var(--flag);}
  .gap{height:70px;}

  /* browse */
  .filters{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:0 0 24px;}
  .filters .chip{font-size:14px; padding:8px 14px;}
  .filters .chip.on{background:var(--ink); color:#fff;}
  .filters .chip.off{opacity:.55;}
  .filters input{margin-left:auto; min-width:220px;}
  .subnav{display:flex; gap:8px; margin:0 0 18px;}
  .subnav a{font-weight:600; font-size:15px; text-decoration:none; padding:8px 14px; border-radius:99px; background:var(--surface); color:var(--stone);}
  .subnav a[aria-current]{background:var(--ink); color:#fff;}
  .artist{display:flex; flex-direction:column; gap:8px; border:1.5px solid var(--line); border-radius:12px; padding:18px 20px; text-decoration:none; background:var(--white); color:inherit;}
  .artist:hover{border-color:var(--ink);}
  .artist h3{margin:0;}
  .artist p{margin:0; color:var(--stone); font-size:15px; line-height:1.45;}
  .artist .chips{display:flex; gap:6px; flex-wrap:wrap;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:22px; margin-bottom:80px;}
  .tile{display:block; border:1.5px solid var(--line); border-radius:12px; overflow:hidden; text-decoration:none; background:var(--white);}
  .tile:hover{border-color:var(--ink);}
  .spark{height:96px; border-bottom:1px solid var(--line);}
  .spark svg{width:100%; height:100%; display:block;}
  .tile-body{padding:16px 18px 18px;}
  .tile h3{margin-bottom:2px;}
  .tile .by{color:var(--stone); font-size:15px; margin:0 0 12px;}
  .facts{display:flex; flex-wrap:wrap; gap:8px; align-items:center;}
  .facts span{font-size:14px; color:var(--stone);}
  .facts .chip{color:inherit;}
  .facts .chip.good{color:var(--good);} .facts .chip.flag{color:var(--flag);}
  .empty-state{padding:40px 0; color:var(--stone);}

  /* profile */
  .who{display:flex; align-items:center; gap:18px; margin:44px 0 22px;}
  .avatar{width:60px; height:60px; border-radius:50%; background:var(--pink); border:1.5px solid var(--ink); display:flex; align-items:center; justify-content:center; font-weight:800; font-stretch:112%; font-size:26px; flex:0 0 auto;}
  .who .title-input{max-width:360px;}
  .rows{border:1px solid var(--line); border-radius:12px; overflow:hidden; margin:0 0 30px;}
  .rowitem{display:grid; grid-template-columns:1fr 130px 90px 140px 60px; gap:14px; align-items:center; padding:13px 18px; border-top:1px solid var(--line); font-size:15px;}
  .rowitem:first-child{border-top:0;}
  .rowitem a{font-weight:600;}
  .rowitem.wfile{display:flex; flex-wrap:wrap; align-items:center; gap:6px 16px;}
  .rowitem.wfile>span:first-child{flex:1 1 220px; min-width:0; overflow-wrap:anywhere; display:flex; align-items:center; gap:12px;}
  .work-top{margin-top:30px;}
  .feedback{margin-top:34px;}
  .react{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:12px 0 26px;}
  .rbtn{font:inherit; font-weight:600; display:inline-flex; align-items:center; gap:8px; background:var(--white); color:var(--ink); border:1.5px solid #C4C6CD; border-radius:99px; padding:9px 16px; cursor:pointer;}
  .rbtn:hover{border-color:var(--ink);}
  .rbtn[aria-pressed="true"]{background:var(--ink); color:#fff; border-color:var(--ink);}
  .cm-h{font-size:20px; margin:0 0 12px;}
  .cm-in{width:100%; max-width:640px; min-height:90px; resize:vertical; line-height:1.55;}
  .cm-sort{margin:18px 0 6px;}
  .cm-sort select{width:auto;}
  .cm-list{list-style:none; margin:8px 0 18px; padding:0; max-width:700px;}
  .cm{padding:14px 0; border-top:1px solid var(--line);}
  .cm:first-child{border-top:0;}
  .cm-head{font-size:15px; margin-bottom:4px;}
  .cm-head a{text-decoration:none;}
  .cm-body{white-space:pre-wrap; overflow-wrap:anywhere; margin:0 0 6px;}
  .cm-act{display:flex; gap:14px;}
  .cm-note{font-size:14px; margin:6px 0 0;}
  .cm-rep{margin-top:8px;}
  .cm-rep select{width:auto; max-width:100%;}
  .legal h2{font-size:22px; margin:34px 0 10px;}
  .legal p, .legal li{max-width:68ch;}
  .legal .updated{color:var(--stone); margin-top:-4px;}
  .foot-links a{margin-left:14px; color:inherit;}
  .check{display:flex; gap:10px; align-items:flex-start; font-weight:500; margin:18px 0 0; max-width:520px;}
  .check input{margin-top:4px; flex:none; width:18px; height:18px;}
  .report-box{margin-top:30px; max-width:560px;}
  .report-box select, .report-box textarea{width:100%; max-width:560px;}
  .report-box textarea{min-height:88px; resize:vertical;}
  .danger-zone{border-color:#E4B6BD;}
  .title-input.small{font-size:17px; font-weight:500; font-stretch:100%; max-width:420px;}
  .facts-list{display:grid; grid-template-columns:max-content 1fr; gap:6px 18px; margin:0 0 14px; font-size:15px;}
  .facts-list dt{color:var(--stone);} .facts-list dd{margin:0;}
  .fp{font-family:'Courier Prime',ui-monospace,monospace; word-break:break-all;}
  .panel.verify{max-width:none;}
  .panel{border:1.5px solid var(--line); border-radius:12px; padding:20px 22px; margin:30px 0 0; max-width:640px;}
  .panel h2{font-size:20px; margin-bottom:8px;}
  fieldset.vis{border:1.5px solid var(--line); border-radius:12px; padding:12px 16px 8px; margin:18px 0 8px; max-width:560px;}
  fieldset.vis legend{font-weight:600; padding:0 6px;}
  .vis-opt{display:flex; gap:10px; align-items:flex-start; margin:0 0 10px; cursor:pointer;}
  .vis-opt input{margin-top:5px;}
  .vis-opt small{display:block; color:var(--muted); font-weight:400; line-height:1.4;}
  .livenote{display:block; font-weight:400; margin-top:2px;}
  .release{margin:6px 0 14px;}
  .linkbox{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:10px 0 0;}
  .linkbox input{flex:1 1 260px; min-width:0;}
  .panel .row{display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:12px;}

  footer{margin-top:96px; border-top:1px solid var(--line); padding:22px 0 34px; font-size:14px; color:var(--stone);}

  @media (max-width:860px){
    .crafts{grid-template-columns:1fr;}

      h+='<button type="button" class="tab'+(S[i].paste?' p':'')+'" tabindex="-1" aria-hidden="true" data-i="'+i+'" title="'+r.n+' revision, '+fmtClock(S[i].t)+'" style="--bg:'+r.bg+';--ink:'+r.ink+'"></button>';
    }
    stack.innerHTML=h;
  }
  function show(){
    var S=snaps();
    if(!S.length){
      page.style.background='#fff';
      revName.textContent='White revision';
      text.innerHTML='<span class="empty">Nothing recorded yet. Start typing and the chart fills in.</span>';
      info.textContent='No snapshots yet'; note.hidden=true; return;
    }
    if(idx>S.length-1) idx=S.length-1;
    if(idx<0) idx=0;
    var s=S[idx], r=rev(idx), xv=Math.min(1000,s.t*1000/tmaxMs*1000);
    var head=svg.querySelector('.head'), fut=svg.querySelector('.future');
    if(head){ head.setAttribute('x1',xv); head.setAttribute('x2',xv); }
    if(fut){ fut.setAttribute('x',xv); fut.setAttribute('width',Math.max(0,1000-xv)); }
    var tabs=stack.children;
    for(var i=0;i<tabs.length;i++) tabs[i].classList.toggle('on',i===idx);
    plot.setAttribute('aria-valuenow',idx); plot.setAttribute('aria-valuemax',S.length-1);
    plot.setAttribute('aria-valuetext','Snapshot '+(idx+1)+' of '+S.length+', '+fmtClock(s.t));
    page.style.background=r.bg;
    revName.textContent=r.n+' revision'+(r.round>1?', round '+r.round:'');
    info.textContent='Snapshot '+(idx+1)+' of '+S.length+', '+fmtClock(s.t)+' in, '+chars((s.text||'').length);
    if(s.paste){ note.hidden=false; note.textContent='About '+chars(s.paste)+' were pasted in at this point.'; } else { note.hidden=true; }
    if(s.text) text.textContent=s.text; else text.innerHTML='<span class="empty">(empty at this point)</span>';
  }
  function full(){ drawChart(); show(); }
  function seek(e){
    var rc=plot.getBoundingClientRect();
    if(!rc.width) return;
    var f=Math.min(1,Math.max(0,(e.clientX-rc.left)/rc.width)), target=f*tmaxMs/1000, S=snaps(), best=0;
    for(var i=0;i<S.length;i++){ if(S[i].t<=target) best=i; }
    idx=best; follow=(idx===S.length-1); show();
  }
  plot.addEventListener('pointerdown',function(e){ stop(); dragging=true; try{ plot.setPointerCapture(e.pointerId); }catch(x){} seek(e); });
  plot.addEventListener('pointermove',function(e){ if(dragging) seek(e); });
  plot.addEventListener('pointerup',function(){ dragging=false; });
  plot.addEventListener('pointercancel',function(){ dragging=false; });
  plot.addEventListener('keydown',function(e){
    var S=snaps(), k=e.key, n=idx;
    if(k==='ArrowRight') n=idx+1; else if(k==='ArrowLeft') n=idx-1; else if(k==='Home') n=0; else if(k==='End') n=S.length-1; else return;
    e.preventDefault(); stop();
    idx=Math.max(0,Math.min(S.length-1,n)); follow=(idx===S.length-1); show();
  });
  stack.addEventListener('click',function(e){
    var b=e.target.closest('.tab'); if(!b) return;
    stop(); idx=parseInt(b.getAttribute('data-i'),10); follow=(idx===snaps().length-1); show();
  });
  play.addEventListener('click',function(){ if(timer){ stop(); } else { startPlay(); } });

  idx=Math.max(0,snaps().length-1);
  setLabel(false);
  full();
  if(opts.autoplay && snaps().length>1){ idx=0; follow=false; show(); startPlay(); }
  var api={
    update:function(nd){ d=nd; if(follow) idx=snaps().length-1; full(); },
    destroy:stop
  };
  cleanups.push(stop);
  return api;
}

function viewEditor(){
  document.title='Write · Handproof';
  var fresh=function(){ return {title:'',text:'',snaps:[],series:[],backspaces:0,pasted:0,pasteEvents:0,clock:0,last:0,active:0,lastSnapText:'',pendingPaste:0,mode:null,cloud:null,outSeries:[],outSnaps:[],sentClock:0}; };
  if(!draft) draft=fresh();
  if(!Array.isArray(draft.outSeries)) draft.outSeries=[];
  if(!Array.isArray(draft.outSnaps)) draft.outSnaps=[];
  if(!draft.sentClock) draft.sentClock=0;
  var lostCloud=false;
  if(draft.mode==='cloud' && (!cloudOn() || !user || (draft.cloud && draft.cloud.uid!==user.id))){
    /* the account this draft was recording to isn't signed in here, so it can only finish as a local piece */
    draft.mode='local'; draft.cloud=null; draft.outSeries=[]; draft.outSnaps=[]; lostCloud=true;
  }
  app.innerHTML=
  '<div class="wrap narrow">'+
    '<h1>Write</h1>'+
    (restoredNotice?'<p class="notice" id="restored">Restored your unfinished draft from last time.</p>':'')+
    '<p class="notice" id="where" hidden></p>'+
    '<label for="t">Title</label>'+
    '<input class="title-input" id="t" type="text" maxlength="120" placeholder="Untitled">'+
    '<label for="x">Text</label>'+
    '<textarea class="draft" id="x" placeholder="Start typing. The recording begins with your first keystroke."></textarea>'+
    '<div class="stats" id="stats">'+
      '<div class="stat"><b id="s-time">0s</b><span>active time</span></div>'+
      '<div class="stat"><b id="s-words">0</b><span>words</span></div>'+
      '<div class="stat"><b id="s-snaps">0</b><span>snapshots</span></div>'+
      '<div class="stat"><b id="s-del">0</b><span>deletions</span></div>'+
      '<div class="stat"><b id="s-paste">0</b><span>characters pasted</span></div>'+
    '</div>'+
    '<h2>Recording so far</h2>'+
    '<div id="live"></div>'+
    '<div id="vispick" hidden>'+visPickerHTML('evis','public')+'</div>'+
    '<div class="actions">'+
      '<button class="btn primary" id="publish" type="button">Publish</button>'+
      '<button class="btn" id="discard" type="button">Discard draft</button>'+
      '<span class="muted" id="saved" aria-live="polite"></span>'+
    '</div>'+
  '</div>';
  restoredNotice=false;

  var t=document.getElementById('t'), x=document.getElementById('x'), pub=document.getElementById('publish');
  var savedEl=document.getElementById('saved');
  t.value=draft.title; x.value=draft.text;
  var rp=mountReplay(document.getElementById('live'),{snaps:draft.snaps,series:draft.series},'Your draft');
  var debounce=null, saveTimer=null, flushTimer=null, flushing=null, creating=null;
  var whereEl=document.getElementById('where');

  function effMode(){ return draft.mode || ((cloudOn() && user && !draft.series.length && !draft.text)?'cloud':'local'); }
  function showWhere(){
    var m=effMode(), h='';
    if(m==='cloud') h='Signed in as '+esc((user&&user.email)||'you')+'. This piece is being recorded to your account and gets a link when you publish. The public replay shows every version, including text you delete, so don’t type anything you wouldn’t want shown.';
    else if(lostCloud) h='This draft was recording to an account that isn’t signed in here, so it will publish to this browser only.';
    else if(cloudOn() && draft.series.length && user) h='This draft started before you signed in, so it will publish to this browser only. Start a new draft to record to your account.';
    else if(cloudOn()) h='You’re not signed in, so this piece stays in this browser and only you can see it. An account is the easiest way to store your work, get a public link, and let other people see it. <a href="#/account">Sign in or create one</a> before you start.';
    whereEl.innerHTML=h; whereEl.hidden=!h;
    var vp=document.getElementById('vispick'); if(vp) vp.hidden=(m!=='cloud');
  }
  function setStatus(s){ savedEl.textContent=s; }
  function ensurePiece(){
    if(draft.cloud) return Promise.resolve(draft.cloud.id);
    if(!creating){
      creating=rpc('create_piece',{p_title:draft.title||'Untitled'}).then(function(id){
        draft.cloud={id:id,uid:user.id}; creating=null; store.set(DRAFT_KEY,draft); return id;
      },function(e){ creating=null; throw e; });
    }
    return creating;
  }
  function doFlush(){
    if(!draft || draft.mode!=='cloud') return null;
    if(!draft.outSeries.length && !draft.outSnaps.length) return null;
    return ensurePiece().then(function(id){
      var s=draft.outSeries.splice(0), n=draft.outSnaps.splice(0);
      var claimed=Math.max(0,Math.round(draft.clock-draft.sentClock)), prevSent=draft.sentClock;
      draft.sentClock=draft.clock;
      return rpc('append_batch',{p_piece:id,p_claimed_ms:claimed,p_series:s,p_snapshots:n,p_title:draft.title||null}).then(function(r){
        if(draft) store.set(DRAFT_KEY,draft); return r;
      },function(e){
        draft.outSeries=s.concat(draft.outSeries); draft.outSnaps=n.concat(draft.outSnaps); draft.sentClock=prevSent;
        throw e;
      });
    });
  }
  function flush(){
    var p=(flushing||Promise.resolve()).then(doFlush);
    flushing=p.then(function(){ setStatus('Saved to your account'); },function(){
      setStatus('Couldn’t reach the server. Your writing is kept in this browser and will be sent when the connection is back.');
      scheduleFlush(10000);
    });
    return p;
  }
  function scheduleFlush(ms){
    if(draft && draft.mode==='cloud'){ clearTimeout(flushTimer); flushTimer=setTimeout(function(){ flush().catch(function(){}); },ms); }
  }

  function refresh(){
    document.getElementById('s-time').textContent=fmtDur(draft.active/1000);
    document.getElementById('s-words').textContent=wordCount(draft.text);
    document.getElementById('s-snaps').textContent=draft.snaps.length;
    document.getElementById('s-del').textContent=draft.backspaces;
    var sp=document.getElementById('s-paste');
    sp.textContent=draft.pasted; sp.className=draft.pasted>0?'bad':'';
    pub.disabled=!draft.text.trim();
  }
  function persist(){
    clearTimeout(saveTimer);
    saveTimer=setTimeout(function(){
      var ok=store.set(DRAFT_KEY,draft);
      savedEl.textContent=ok?(draft&&draft.mode==='cloud'?((draft.outSeries.length||draft.outSnaps.length)?'Saving to your account…':'Saved to your account'):'Draft saved'):'Couldn’t save the draft because browser storage is full. Publish or export your pieces to free up space.';
    },700);
  }
  function snap(paste){
    if(draft.text===draft.lastSnapText && !paste) return;
    draft.lastSnapText=draft.text;
    var sn={t:Math.round(draft.clock/1000),text:draft.text,paste:paste||0};
    draft.snaps.push(sn);
    if(draft.mode==='cloud'){ draft.outSnaps.push({t:sn.t,text:sn.text,paste:sn.paste}); if(draft.outSnaps.length>=5) flush().catch(function(){}); else scheduleFlush(8000); }
    draft.snaps=sampleDown(draft.snaps);
    rp.update({snaps:draft.snaps,series:draft.series});
    refresh(); persist();
  }
  function rec(pt){
    draft.series.push(pt);
    if(draft.mode==='cloud'){
      draft.outSeries.push(pt);
      if(draft.outSeries.length>=300) flush().catch(function(){}); else scheduleFlush(8000);
    }
  }

  t.addEventListener('input',function(){ draft.title=t.value; persist(); });
  x.addEventListener('paste',function(e){
    var cd=e.clipboardData, s='';
    try{ s=cd?cd.getData('text'):''; }catch(err){}
    draft.pendingPaste=s.length;
  });
  x.addEventListener('drop',function(e){
    var dt=e.dataTransfer, s='';
    try{ s=dt?dt.getData('text'):''; }catch(err){}
    draft.pendingPaste=s.length;
  });
  x.addEventListener('input',function(e){
    var now=Date.now(), v=x.value, it=e.inputType||'', prevLen=draft.text.length;
    if(!draft.mode){
      draft.mode=(cloudOn() && user && !draft.series.length && !draft.text)?'cloud':'local';
      showWhere();
    }
    if(draft.last){
      var gap=now-draft.last;
      draft.clock+=Math.min(gap,60000);
      if(gap<30000) draft.active+=gap;
    } else if(!draft.series.length){
      rec([0,0,0]);
    }
    draft.last=now;
    if(it.indexOf('delete')===0) draft.backspaces++;
    var added=v.length-prevLen, pasteChars=0;
    if(draft.pendingPaste>0){ pasteChars=draft.pendingPaste; }
    else if(it==='insertFromPaste'||it==='insertFromDrop'||it==='insertFromYank'){ pasteChars=Math.max(added,0); }
    else if(added>30){ pasteChars=added; }   /* a big chunk arriving in one go that was not a keystroke */
    draft.pendingPaste=0;
    if(pasteChars>0){ draft.pasted+=pasteChars; draft.pasteEvents++; }
    draft.text=v;
    rec([draft.clock,v.length,pasteChars]);
    if(draft.series.length>2400) draft.series=capSeries(draft.series);
    clearTimeout(debounce);
    if(pasteChars>0){ snap(pasteChars); }
    else{
      debounce=setTimeout(function(){ snap(0); },1200);
      refresh(); persist();
    }
  });

  document.getElementById('discard').addEventListener('click',function(){
    if(draft.text.trim() && !confirm('Discard this draft and its recording?')) return;
    clearTimeout(debounce); clearTimeout(saveTimer); clearTimeout(flushTimer);
    if(draft.mode==='cloud' && draft.cloud && cloudOn()) rpc('delete_piece',{p_piece:draft.cloud.id}).catch(function(){});
    draft=null; store.remove(DRAFT_KEY);
    location.hash='#/';
  });
  pub.addEventListener('click',function(){
    if(!draft.text.trim()) return;
    clearTimeout(debounce); clearTimeout(saveTimer); clearTimeout(flushTimer);
    snap(0);
    if(draft.mode==='cloud'){
      pub.disabled=true; setStatus('Publishing…');
      var title=(draft.title||'').trim()||'Untitled';
      flush().then(function(){
        if(!draft.cloud) throw new Error('nothing was recorded');
        return rpc('set_visibility',{p_kind:'piece',p_id:draft.cloud.id,p_value:visValue('evis')}).then(function(){ return rpc('publish_piece',{p_piece:draft.cloud.id,p_title:title}); });
      }).then(function(){
        var id=draft.cloud.id;
        draft=null; store.remove(DRAFT_KEY);
        location.hash='#/p/'+encodeURIComponent(id);
      },function(err){
        pub.disabled=false;
        setStatus('Couldn’t publish: '+((err&&err.message)||'unknown error')+'. Your draft is still here. Try again in a moment.');
      });
      return;
    }
    var S=draft.snaps, last=S[S.length-1];
    if(!last || last.text!==draft.text) S.push({t:Math.round(draft.clock/1000),text:draft.text,paste:0});
    var flat=draft.text.trim().replace(/\s+/g,' ');
    var piece={
      id:'p_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
      title:(draft.title||'').trim()||'Untitled',
      author:userName||'You',
      excerpt:flat.slice(0,150)+(flat.length>150?'…':''),
      snapshots:S, series:capSeries(draft.series),
      wordCount:wordCount(draft.text),
      backspaces:draft.backspaces, pasted:draft.pasted, pasteEvents:draft.pasteEvents,
      activeSeconds:Math.round(draft.active/1000),
      createdAt:Date.now(), demo:false
    };
    pieces.unshift(piece);
    if(!store.set(PIECES_KEY,pieces)){
      pieces.shift();
      alert('Couldn’t publish because browser storage is full. Export your pieces from the Profile page or delete older ones, then publish again.');
      return;
    }
    draft=null; store.remove(DRAFT_KEY);
    location.hash='#/piece/'+encodeURIComponent(piece.id);
  });
  cleanups.push(function(){
    clearTimeout(debounce); clearTimeout(saveTimer); clearTimeout(flushTimer);
    if(draft){
      store.set(DRAFT_KEY,draft);
      if(draft.mode==='cloud') flush().catch(function(){});
    }
  });
  showWhere();
  if(draft.mode==='cloud' && (draft.outSeries.length||draft.outSnaps.length)) scheduleFlush(1000);
  refresh();
}

      if(pass && pw.value.length<8){ say('Use a password of at least 8 characters.'); pw.focus(); return false; }

        if(r&&r.error){
          var er=r.error;

            : (er.message||'That didn’t work. Try again.'));
          return;
        }
        done(r&&r.data);
      },function(){ if(!alive) return; busy(false); say('Couldn’t reach the server. Check your connection and try again.'); });
    }
    document.getElementById('af').addEventListener('submit',function(e){
      e.preventDefault(); if(!need(true)) return;

/* JPEG metadata: warn about GPS, and offer to strip it before upload */
function jpegSegments(u8){
  if(u8.length<4 || u8[0]!==0xFF || u8[1]!==0xD8) return null;
  var segs=[], i=2;
  while(i+4<=u8.length){
    if(u8[i]!==0xFF) break;
    var mk=u8[i+1];
    if(mk===0xDA || mk===0xD9) break;
    if(mk===0x01 || (mk>=0xD0 && mk<=0xD7)){ i+=2; continue; }
    var len=(u8[i+2]<<8)|u8[i+3];
    if(len<2 || i+2+len>u8.length) break;
    segs.push({m:mk,s:i,e:i+2+len});
    i+=2+len;
  }
  return segs;
}
function rd16(u8,o,le){ return le?(u8[o]|(u8[o+1]<<8)):((u8[o]<<8)|u8[o+1]); }
function rd32(u8,o,le){ return le?(u8[o]+u8[o+1]*256+u8[o+2]*65536+u8[o+3]*16777216):(u8[o]*16777216+u8[o+1]*65536+u8[o+2]*256+u8[o+3]); }
function isExifSeg(u8,s){ return u8[s+4]===0x45 && u8[s+5]===0x78 && u8[s+6]===0x69 && u8[s+7]===0x66 && u8[s+8]===0 && u8[s+9]===0; }
function jpegHasGps(u8){
  var segs=jpegSegments(u8); if(!segs) return false;
  for(var k=0;k<segs.length;k++){
    var g=segs[k]; if(g.m!==0xE1 || !isExifSeg(u8,g.s)) continue;
    var t=g.s+10, le=u8[t]===0x49, ifd=t+rd32(u8,t+4,le);
    if(ifd+2>g.e) continue;
    var n=rd16(u8,ifd,le);
    for(var e=0;e<n;e++){ var o=ifd+2+e*12; if(o+12>g.e) break; if(rd16(u8,o,le)===0x8825) return true; }
  }
  return false;
}
function stripJpegMeta(u8){
  var segs=jpegSegments(u8); if(!segs) return u8;
  var out=[], pos=0, total=0;
  for(var k=0;k<segs.length;k++){
    var g=segs[k];
    if(g.m===0xE1 || g.m===0xED){ out.push(u8.subarray(pos,g.s)); total+=g.s-pos; pos=g.e; }
  }
  out.push(u8.subarray(pos)); total+=u8.length-pos;
  var res=new Uint8Array(total), at=0;
  out.forEach(function(p){ res.set(p,at); at+=p.length; });
  return res;
}
function makeThumb(blob){
  return new Promise(function(resolve){
    var url=URL.createObjectURL(blob), img=new Image();
    img.onload=function(){
      try{

        c.width=Math.max(1,Math.round(img.width*s)); c.height=Math.max(1,Math.round(img.height*s));
        var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
        c.toBlob(function(b){ URL.revokeObjectURL(url); resolve(b && b.size<=400000 ? b : null); },'image/jpeg',0.8);
      }catch(e){ URL.revokeObjectURL(url); resolve(null); }
    };

  });
}

/* signed links for private files (valid for an hour, cached) */
var urlCache={};
function signedUrls(paths){
  var now=Date.now(), need=[];
  paths.forEach(function(p){ if(p && (!urlCache[p] || urlCache[p].exp<now) && need.indexOf(p)<0) need.push(p); });
  var done=need.length?Promise.resolve(sb.storage.from('works').createSignedUrls(need,3600)).then(function(r){
    if(r.error) throw new Error(r.error.message||'Couldn’t load files');
    (r.data||[]).forEach(function(e){ if(e && e.signedUrl) urlCache[e.path]={url:e.signedUrl,exp:now+3300000}; });
  }):Promise.resolve();
  return done.then(function(){ var m={}; paths.forEach(function(p){ if(urlCache[p]) m[p]=urlCache[p].url; }); return m; });
}
function removeFiles(paths){
  var chunks=[]; for(var i=0;i<paths.length;i+=50) chunks.push(paths.slice(i,i+50));
  return chunks.reduce(function(p,c){ return p.then(function(){ return Promise.resolve(sb.storage.from('works').remove(c)).then(function(){},function(){}); }); },Promise.resolve());
}

        '<div class="row" style="margin-top:18px"><button class="btn primary" type="submit" id="mgo">Continue and add files</button> <span class="muted" id="mmsg" role="status" aria-live="polite"></span></div>'+
      '</form>'+
    '</div>';

  function workspace(wid){

    }
    function recorderHTML(){
      var can=!!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
      return '<div class="panel" id="recpanel"><h2>Record a take here</h2>'+
        (can?
          '<p>A take recorded here is checked against the server’s clock: it can only be added if at least as much time passed as the take is long, so a finished recording can’t be uploaded faster than it could have been made. Your microphone is used only while you record, and nothing is sent until you add the take.</p>'+
          '<div class="row"><button class="btn" type="button" id="recstart">Start recording</button> <button class="btn primary" type="button" id="recstop" hidden>Stop</button> <span class="fp" id="rectime" aria-live="off"></span> <span class="muted" id="recmsg" role="status" aria-live="polite"></span></div>'+
          '<div id="recdone" hidden><audio id="recplay" controls></audio><div class="row" style="margin-top:10px"><button class="btn primary" type="button" id="recadd">Add this take</button> <button class="btn" type="button" id="recdrop">Discard</button></div></div>'

    }
    function refreshPub(){ var pb=document.getElementById('pub'), ow=document.getElementById('own'); if(pb&&ow) pb.disabled=!(hasFinal() && ow.checked) || busy; }
    function wireRecorder(){
      var bStart=document.getElementById('recstart'); if(!bStart) return;
      var bStop=document.getElementById('recstop'), tEl=document.getElementById('rectime'), msg=document.getElementById('recmsg');
      var done=document.getElementById('recdone'), play=document.getElementById('recplay');
      var st=null, tick=null, take=null, MAXMS=600000;
      function say(t){ if(alive) msg.textContent=t; }
      function release(){ if(st&&st.stream){ st.stream.getTracks().forEach(function(t){ t.stop(); }); } clearInterval(tick); tick=null; }
      function clearTake(){ if(take&&take.url) URL.revokeObjectURL(take.url); take=null; done.hidden=true; play.removeAttribute('src'); }
      cleanups.push(function(){ try{ if(st&&st.rec&&st.rec.state!=='inactive') st.rec.stop(); }catch(e){} release(); clearTake(); });
      function pickType(){
        var c=['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/mp4']; 
        for(var i=0;i<c.length;i++){ try{ if(MediaRecorder.isTypeSupported(c[i])) return c[i]; }catch(e){} }
        return '';
      }
      bStart.addEventListener('click',function(){
        clearTake(); bStart.disabled=true; say('Asking for your microphone…');
        navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
          return rpc('start_take',{p_work:wid}).then(function(sess){
            if(!alive){ stream.getTracks().forEach(function(t){ t.stop(); }); return; }
            var type=pickType(), rec;
            try{ rec=type?new MediaRecorder(stream,{mimeType:type}):new MediaRecorder(stream); }catch(e){ stream.getTracks().forEach(function(t){ t.stop(); }); throw new Error('This browser can’t record in a supported format.'); }
            st={stream:stream,rec:rec,chunks:[],session:sess.session,t0:0,claimed:0};
            rec.ondataavailable=function(e){ if(e.data&&e.data.size) st.chunks.push(e.data); };
            rec.onstop=function(){
              var base=String(rec.mimeType||type||'audio/webm').split(';')[0];
              var blob=new Blob(st.chunks,{type:base});
              release(); bStop.hidden=true; bStart.hidden=false; bStart.disabled=false; tEl.textContent='';
              if(!alive) return;
              if(st.claimed<1000){ say('That take was under a second. Record again.'); return; }
              take={blob:blob,mime:base,claimed:st.claimed,session:st.session,url:URL.createObjectURL(blob)};
              play.src=take.url; done.hidden=false; say('Recorded '+fmtDur(Math.round(st.claimed/1000))+'. Listen, then add it or discard it.');
            };
            rec.start(1000);
            st.t0=performance.now(); bStart.hidden=true; bStop.hidden=false; bStop.focus(); say('Recording…');
            tick=setInterval(function(){
              var ms=performance.now()-st.t0; tEl.textContent=fmtClock(Math.floor(ms/1000));
              if(ms>=MAXMS) bStop.click();

          });
        }).catch(function(e){
          bStart.disabled=false; if(!alive) return;
          say(e&&e.name==='NotAllowedError'?'Microphone access was blocked. Allow it in your browser’s site settings and try again.':(e&&e.name==='NotFoundError'?'No microphone was found.':((e&&e.message)||'Couldn’t start recording.')));

      bStop.addEventListener('click',function(){

      document.getElementById('recdrop').addEventListener('click',function(){ clearTake(); say(''); });
      document.getElementById('recadd').addEventListener('click',function(){
        if(!take||busy) return; var b=this; b.disabled=true; busy=true; refreshPub(); say('Adding the take…');
        var t=take, n=d.items.filter(function(i){ return i.role==='live'; }).length+1;
        var ext=/mp4/.test(t.mime)?'m4a':(/ogg/.test(t.mime)?'ogg':'webm'), name='take-'+n+'.'+ext;
        t.blob.arrayBuffer().then(function(buf){
          var u8=new Uint8Array(buf);
          return sha256Hex(u8).then(function(h){
            var path=user.id+'/'+wid+'/'+uuid4()+'-'+name, bucket=sb.storage.from('works');
            return Promise.resolve(bucket.upload(path,t.blob,{contentType:t.mime,upsert:false})).then(function(res){
              if(res.error) throw new Error(res.error.message||'Upload failed');
              return rpc('add_live_take',{p_session:t.session,p_path:path,p_filename:name,p_mime:t.mime,p_bytes:u8.length,p_sha256:h,p_claimed_ms:t.claimed}).then(null,function(e){
                return Promise.resolve(bucket.remove([path])).then(function(){},function(){}).then(function(){ throw e; });
              });
            });
          });
        }).then(function(){
          busy=false; clearTake(); return load().then(function(){ var m=document.getElementById('recmsg'); if(m) m.textContent='Added '+name+'. The server clock confirmed it.'; });
        },function(e){
          busy=false; if(!alive) return; b.disabled=false; refreshPub(); say((e&&e.message)||'Couldn’t add that take.');
        });
      });
    }
    function wireRelease(){

      }).join('')+'</div>';
    }
    function hasFinal(){ return d.items.some(function(i){ return i.role==='final'; }); }
    function render(){
      var k=KINDS[d.kind];
      app.innerHTML=
      '<div class="wrap narrow">'+
        '<p class="byline work-top"><span class="chip '+(KIND_CHIP[d.kind]||'')+'">'+esc(k.name)+'</span> Draft, private until you publish</p>'+
        '<h1>Add your files</h1>'+
        '<p>'+esc(k.tip)+'</p>'+
        '<label for="wt">Title</label><input class="title-input small" id="wt" type="text" maxlength="120" value="'+esc(d.title)+'">'+
        '<label for="wd">About this work <span class="muted">(optional)</span></label><textarea id="wd" class="bio-in" maxlength="1000">'+esc(d.description||'')+'</textarea>'+
        (d.kind==='music'?'<label for="wrel">Link to the released track <span class="muted">(optional, https only)</span></label><input class="title-input small" id="wrel" type="url" maxlength="263" placeholder="https://" value="'+esc(d.release_url||'')+'"><p class="muted small-note" id="wrelmsg" role="status" aria-live="polite">Shown on the page as a link from the artist. Handproof doesn’t check it.</p>':'')+
        '<h2 style="margin-top:30px">Files, in the order the server received them</h2>'+
        '<div id="wl">'+itemsHTML()+'</div>'+
        '<div class="row" style="margin-top:10px"><button class="btn" type="button" id="undo"'+(d.items.length?'':' disabled')+'>Remove the last file</button></div>'+
        (d.kind==='music'?recorderHTML():'')+
        '<div class="panel">'+
          '<h2>Add files</h2>'+
          '<label for="wr">What are these files?</label>'+
          '<select id="wr">'+
            '<option value="process">Work in progress</option>'+
            '<option value="original">Original or source file</option>'+
            '<option value="project">Project file (zip)</option>'+
            '<option value="final">Finished work</option>'+
          '</select>'+
          '<p class="muted small-note" id="whelp"></p>'+
          '<label for="wf">Choose files</label>'+
          '<input type="file" id="wf" multiple accept="'+esc(k.accept)+'">'+
          '<div id="gps" hidden class="banner bad"><p style="margin:0 0 8px"><b id="gpsn"></b> Photos can carry the exact place they were taken, and everything you publish is public.</p>'+
            '<label class="inline" style="font-weight:500"><input type="checkbox" id="strip" checked> Remove location and camera details from these files before uploading (recommended)</label></div>'+
          '<div class="row" style="margin-top:14px"><button class="btn primary" type="button" id="up" disabled>Upload</button> <span class="muted" id="umsg" role="status" aria-live="polite"></span></div>'+
        '</div>'+
        '<div class="panel">'+
          '<h2>Publish</h2>'+
          '<p>'+(hasFinal()?'Publishing makes this page and every file on it viewable, and locks the files so they can’t be changed.':'Add the finished work first. '+esc(k.final))+'</p>'+
          visPickerHTML('wvis','public')+
          '<label class="inline" style="font-weight:500"><input type="checkbox" id="own"> I made this work, I have the right to share every file, and I accept the <a href="#/terms" target="_blank" rel="noopener">Terms</a>.</label>'+
          '<div class="row" style="margin-top:14px"><button class="btn primary" type="button" id="pub" disabled>Publish</button> <button class="linkbtn danger" type="button" id="del">Delete this draft</button> <span class="muted" id="pmsg" role="status" aria-live="polite"></span></div>'+
        '</div>'+
        '<div class="gap"></div>'+

      }
      wr.addEventListener('change',roleHelp); roleHelp();
      var fi=document.getElementById('wf'), up=document.getElementById('up'), umsg=document.getElementById('umsg');

      document.getElementById('own').addEventListener('change',syncPub);

        var gps=document.getElementById('gps'); gps.hidden=true; umsg.textContent='';
        var jpgs=pending.filter(function(f){ return fileMime(f)==='image/jpeg'; });
        Promise.all(jpgs.map(function(f){ return f.slice(0,262144).arrayBuffer().then(function(b){ return jpegHasGps(new Uint8Array(b)); }).catch(function(){ return false; }); })).then(function(res){
          var n=res.filter(Boolean).length;

        busy=true; up.disabled=true; syncPub();

              var m=document.getElementById('umsg'); if(!m) return;
              m.textContent=bad?((done?'Uploaded '+done+' of '+list.length+'. ':'')+lastErr):('Uploaded '+plural(done,'file')+'.');
            });
            return;
          }
          uploadOne(wid,d.kind,role,list[i],strip,function(t){ var m=document.getElementById('umsg'); if(m) m.textContent=t; }).then(function(){ done++; },function(err){
            bad++; lastErr=list[i].name+': '+(err&&err.message||'upload failed');
          }).then(function(){ next(i+1); });
        })(0);
      });
      document.getElementById('undo').addEventListener('click',function(){
        var b=this; b.disabled=true;

        /* a removed image's preview file is left behind and removed with the draft */
      });
      if(d.kind==='music'){ wireRecorder(); wireRelease(); }
      var saveT=null;
      function saveDetails(){ return rpc('update_work',{p_work:wid,p_title:document.getElementById('wt').value,p_description:document.getElementById('wd').value}); }
      ['wt','wd'].forEach(function(x){ document.getElementById(x).addEventListener('change',function(){ saveDetails().catch(function(){}); }); });
      document.getElementById('pub').addEventListener('click',function(){
        var b=this, m=document.getElementById('pmsg'); b.disabled=true; m.textContent='Publishing…';
        rpc('set_visibility',{p_kind:'work',p_id:wid,p_value:visValue('wvis')}).then(function(){ return rpc('publish_work',{p_work:wid,p_title:document.getElementById('wt').value,p_description:document.getElementById('wd').value}); }).then(function(){
          location.hash='#/m/'+encodeURIComponent(wid);
        },function(err){ b.disabled=false; if(alive) m.textContent=/daily/.test(err.message)?'You’ve reached the daily publishing limit. Try again tomorrow.':err.message; });
      });
      document.getElementById('del').addEventListener('click',function(){
        if(!confirm('Delete this draft and all of its files? This can’t be undone.')) return;
        rpc('delete_work',{p_work:wid}).then(function(paths){ return removeFiles(paths||[]); }).then(function(){ location.hash='#/account'; });
      });
      syncPub();
    }
    load();
  }
}

function uploadOne(workId,kind,role,file,strip,say){
  var mime=fileMime(file), bad=fileProblem(kind,role,mime,file.size);
  if(bad) return Promise.reject(new Error(bad));
  var bucket=sb.storage.from('works');
  say('Reading '+file.name+'…');
  function putAndRegister(blob,u8,r,name,type){
    return sha256Hex(u8).then(function(h){
      var path=user.id+'/'+workId+'/'+uuid4()+'-'+safeName(name);
      return Promise.resolve(bucket.upload(path,blob,{contentType:type,upsert:false})).then(function(res){
        if(res.error) throw new Error(/exceed|too large|size/i.test(res.error.message||'')?'That file is too large.':(res.error.message||'Upload failed'));
        return rpc('add_work_item',{p_work:workId,p_role:r,p_path:path,p_filename:name.slice(0,200),p_mime:type,p_bytes:u8.length,p_sha256:h}).then(null,function(e){
          return Promise.resolve(bucket.remove([path])).then(function(){},function(){}).then(function(){ throw e; });
        });
      });
    });
  }
  return file.arrayBuffer().then(function(buf){
    var u8=new Uint8Array(buf);
    if(strip && mime==='image/jpeg') u8=stripJpegMeta(u8);
    var blob=new Blob([u8],{type:mime});
    say('Uploading '+file.name+'…');
    return putAndRegister(blob,u8,role,file.name,mime).then(function(){
      if(role!=='final' || mime.indexOf('image/')!==0) return;
      return makeThumb(blob).then(function(tb){
        if(!tb) return;
        return tb.arrayBuffer().then(function(tbuf){ return putAndRegister(tb,new Uint8Array(tbuf),'thumb','preview.jpg','image/jpeg'); }).catch(function(){});
      });
    });
  });
}

          '<label for="rdet">Details <span class="muted">(optional, up to 1,000 characters)</span></label>'+
          '<textarea id="rdet" maxlength="1000"></textarea>'+
          '<div class="actions" style="margin-bottom:10px"><button class="btn primary" type="submit" id="rsend">Send report</button> <button class="btn" type="button" id="rcancel">Cancel</button></div>'+
        '</form>'+
        '<p class="muted" id="rmsg" aria-live="polite"></p>'+
      '</div>'+
      '<div class="gap"></div>'+
    '</div>';

    setRobots(d.visibility==='unlisted'); wireOwnerVis('work',d.id,function(){ return alive; });
    mountFeedback(document.getElementById('fb'),'work',d.id,function(){ return alive; });
    var allPaths=items.map(function(i){ return i.path; });
    var main=document.getElementById('main');
    signedUrls(allPaths).then(function(m){
      if(!alive) return;
      main.innerHTML=finals.map(function(f){
        var u=m[f.path]; if(!u) return '<p class="muted">Couldn’t load '+esc(f.filename)+'.</p>';
        if(f.mime.indexOf('image/')===0) return '<figure class="work-fig"><img class="work-img" alt="'+esc(d.title)+'" src="'+esc(u)+'"></figure>';
        if(f.mime.indexOf('audio/')===0) return '<figure class="work-fig"><figcaption>'+esc(f.filename)+'</figcaption><audio controls preload="none" src="'+esc(u)+'"></audio></figure>';
        if(f.mime.indexOf('video/')===0) return '<figure class="work-fig"><video class="work-vid" controls preload="metadata" playsinline src="'+esc(u)+'"></video></figure>';
        return '';
      }).join('');
      /* images among the process files get small previews */
      shown.forEach(function(i){
        if(i.role!=='final' && i.mime.indexOf('image/')===0 && m[i.path]){
          var row=app.querySelector('#files [data-seq="'+i.seq+'"]'); if(!row) return;
          var im=document.createElement('img'); im.className='row-thumb'; im.alt=''; im.loading='lazy'; im.src=m[i.path];
          row.firstChild.insertBefore(im,row.firstChild.firstChild);
        }
      });
    },function(){ if(alive) main.innerHTML='<p class="muted">Couldn’t load the files right now. Try again in a moment.</p>'; });

    document.getElementById('files').addEventListener('click',function(e){
      var a=e.target.closest('[data-dl]'); if(!a) return;
      e.preventDefault();
      signedUrls([a.getAttribute('data-dl')]).then(function(m){
        var u=m[a.getAttribute('data-dl')]; if(!u) return;
        var l=document.createElement('a'); l.href=u; l.download=a.getAttribute('data-name'); l.rel='noopener'; document.body.appendChild(l); l.click(); l.remove();
      },function(){});
    });
    var chk=document.getElementById('chk'), cm=document.getElementById('chkmsg');
    chk.addEventListener('click',function(){
      chk.disabled=true; var ok=0, badN=0, i=0;
      signedUrls(allPaths).then(function(m){
        (function next(){
          if(i>=shown.length || !alive){
            chk.disabled=false;
            cm.textContent=badN?(badN+' of '+shown.length+' files do not match their recorded checksums.'):('All '+plural(shown.length,'file')+' match the checksums recorded when they arrived.');
            return;
          }
          var it=shown[i++]; cm.textContent='Checking '+it.filename+'…';
          var row=app.querySelector('#files [data-seq="'+it.seq+'"] [data-res]');
          fetch(m[it.path]).then(function(r){ if(!r.ok) throw new Error('x'); return r.arrayBuffer(); })
            .then(function(b){ return sha256Hex(new Uint8Array(b)); })
            .then(function(h){ if(h===it.sha256){ ok++; if(row) row.textContent='Matches'; } else { badN++; if(row) row.textContent='Does not match'; } },
                  function(){ badN++; if(row) row.textContent='Couldn’t read'; })
            .then(next);
        })();
      },function(){ chk.disabled=false; cm.textContent='Couldn’t load the files right now.'; });
    });
    var c=document.getElementById('copied');
    document.getElementById('link').addEventListener('click',function(){ copyText(location.href,c,'Copied the link'); });
    var rf=document.getElementById('reportform'), ro=document.getElementById('reportopen'), rm=document.getElementById('rmsg');
    function toggle(open){ rf.hidden=!open; ro.setAttribute('aria-expanded',open?'true':'false'); if(open) document.getElementById('rr').focus(); }
    ro.addEventListener('click',function(){ rm.textContent=''; toggle(rf.hidden); });
    document.getElementById('rcancel').addEventListener('click',function(){ toggle(false); ro.focus(); });
    rf.addEventListener('submit',function(e){
      e.preventDefault();
      var send=document.getElementById('rsend'); send.disabled=true; rm.textContent='Sending…';
      rpc('report_work',{p_work:d.id,p_reason:document.getElementById('rr').value,p_details:document.getElementById('rdet').value}).then(function(){
        if(!alive) return;
        toggle(false); document.getElementById('rdet').value=''; send.disabled=false;
        rm.textContent='Thanks. Reports are reviewed, and work that breaks the rules is removed.';
      },function(err){
        if(!alive) return; send.disabled=false;
        rm.textContent=/too many reports/.test(err.message)?'You’ve sent a lot of reports today. Try again tomorrow.':'Couldn’t send the report. Try again in a moment.';
      });
    });
  },function(){ if(alive) missing('The server couldn’t be reached. Try again in a moment.'); });
}

/* ---------- public writer page ---------- */
/* ---------- who can find it: public or link only ---------- */
var VIS_TEXT={
  public:['Public','Listed in Browse and on your writer page.'],
  unlisted:['Link only','Not listed anywhere. Anyone who has the link can open it, with all its files, and can pass the link on. Don’t use this for anything secret.']
};
function visPickerHTML(name,cur,legend,opts){
  opts=opts||[['public'].concat(VIS_TEXT.public),['unlisted'].concat(VIS_TEXT.unlisted)];
  return '<fieldset class="vis"><legend>'+(legend||'Who can find it')+'</legend>'+opts.map(function(o){
    return '<label class="vis-opt"><input type="radio" name="'+name+'" value="'+o[0]+'"'+(cur===o[0]?' checked':'')+'><span><b>'+o[1]+'</b><small>'+o[2]+'</small></span></label>';
  }).join('')+'</fieldset>';
}
function visValue(name){ var el=document.querySelector('input[name="'+name+'"]:checked'); return el?el.value:'public'; }
function setRobots(on){
  var m=document.querySelector('meta[name="robots"][data-dyn]');
  if(on){
    if(!m){ m=document.createElement('meta'); m.setAttribute('name','robots'); m.setAttribute('data-dyn','1'); document.head.appendChild(m); }
    m.setAttribute('content','noindex, nofollow');
  }else if(m){ m.parentNode.removeChild(m); }
}
function visNoteHTML(v){
  return '<p id="visnote"'+(v==='unlisted'?'':' hidden')+'><span class="chip">Link only</span> <span class="muted">Not listed in Browse. Only people with this link can find it.</span></p>';
}
/* the owner's own panel on a published piece or work: change who can find it, and copy the link */
function ownerVisHTML(d){
  return '<div class="panel" id="vispanel"><h2>Sharing</h2>'+visPickerHTML('vis',d.visibility||'public')+
    '<p><button class="btn" type="button" id="vissave">Save</button> <span class="muted" id="vismsg" role="status" aria-live="polite"></span></p>'+
    (d.kind==='music'?'<label for="relin">Link to the released track <span class="muted">(optional, https only)</span></label><div class="linkbox"><input class="title-input small" id="relin" type="url" maxlength="263" placeholder="https://" value="'+esc(d.release_url||'')+'"> <button class="btn" type="button" id="relsave">Save link</button></div>':'')+
    '<div class="linkbox"><input class="title-input small" id="vislink" type="text" readonly aria-label="Link to this page" value="'+esc(location.href)+'"> <button class="btn" type="button" id="vscopy">Copy link</button></div></div>';
}
function wireOwnerVis(kind,id,isAlive){
  var save=document.getElementById('vissave'); if(!save) return;
  var msg=document.getElementById('vismsg'), note=document.getElementById('visnote');
  save.addEventListener('click',function(){
    var v=visValue('vis'); save.disabled=true; msg.textContent='Saving…';
    rpc('set_visibility',{p_kind:kind,p_id:id,p_value:v}).then(function(){
      if(!isAlive()) return;
      save.disabled=false; msg.textContent=v==='unlisted'?'Saved. It’s now link only.':'Saved. It’s now public and listed in Browse.';
      if(note) note.hidden=v!=='unlisted';
      setRobots(v==='unlisted');
    },function(e){ if(isAlive()){ save.disabled=false; msg.textContent='Couldn’t save that: '+((e&&e.message)||'try again'); } });
  });
  var rs=document.getElementById('relsave');
  if(rs) rs.addEventListener('click',function(){
    var el=document.getElementById('relin'); msg.textContent='Saving…';
    rpc('set_release_link',{p_work:id,p_url:el.value}).then(function(u){ if(!isAlive()) return; el.value=u||''; msg.textContent=u?'Saved the release link. Reload to see it on the page.':'Cleared the release link.'; },function(e){ if(isAlive()) msg.textContent=(e&&e.message)||'Couldn’t save that link.'; });
  });
  document.getElementById('vscopy').addEventListener('click',function(){
    var el=document.getElementById('vislink'); el.focus(); el.select();
    copyText(el.value,msg,'Copied the link');
  });
}
function safeUrl(u){ return /^https?:\/\/[^\s]+$/i.test(u||''); }
function contactHTML(c){
  c=(c||'').trim(); if(!c) return '';
  if(/^[^\s@<>"']+@[^\s@<>"']+\.[^\s@<>"']+$/.test(c)) return '<a href="mailto:'+esc(c)+'">'+esc(c)+'</a>';
  if(safeUrl(c)) return '<a href="'+esc(c)+'" rel="noopener noreferrer nofollow ugc" target="_blank">'+esc(c)+'</a>';
  return esc(c);
}
function viewWriter(id){
  document.title='Handproof';
  var alive=true; cleanups.push(function(){ alive=false; });
  function missing(msg){
    document.title='Not found · Handproof';
    app.innerHTML='<div class="wrap narrow"><h1>That profile isn’t here</h1><p>'+esc(msg)+'</p><p><a class="btn" href="#/browse">Browse work</a></p></div>';
  }
  if(!cloudOn()){ missing('Profiles only work on a site that has accounts turned on.'); return; }
  app.innerHTML='<div class="wrap narrow"><p class="muted" role="status">Loading…</p></div>';
  if(!/^[0-9a-f-]{36}$/i.test(id)){ missing('That link doesn’t look right.'); return; }
  rpc('get_public_profile',{p_id:id}).then(function(d){
    if(!alive) return;
    if(!d){ missing('The account may have been deleted.'); return; }
    document.title=d.name+' · Handproof';
    setRobots(d.visibility==='link');
    var list=(d.pieces||[]).map(cloudPiece);
    var links=[];
    if(d.website && safeUrl(d.website)) links.push('<p class="pf-line"><span class="muted">Website</span> <a href="'+esc(d.website)+'" rel="noopener noreferrer nofollow ugc" target="_blank">'+esc(d.website.replace(/^https?:\/\//i,''))+'</a></p>');
    if(d.contact) links.push('<p class="pf-line"><span class="muted">Contact</span> '+contactHTML(d.contact)+'</p>');
    app.innerHTML=
    '<div class="wrap">'+
      '<div class="who"><div class="avatar" aria-hidden="true">'+esc((d.name||'W').charAt(0).toUpperCase())+'</div>'+
        '<div><h1 style="margin:0">'+esc(d.name)+'</h1><p class="byline" style="margin:4px 0 0">On Handproof since '+fmtDate(Date.parse(d.joined))+'</p></div></div>'+
      (d.mine&&d.visibility==='link'?'<p><span class="chip">Link only</span> <span class="muted">This page isn’t linked from your pieces. Only people with its address can find it. Change this in Account.</span></p>':'')+
      (d.bio?'<p class="pf-bio">'+esc(d.bio)+'</p>':'')+
      links.join('')+
      (user&&!d.mine?'<p id="blkrow">'+(d.blocked?'<span class="chip">Blocked</span> <span class="muted">You don’t see their work or comments.</span> ':'')+'<button class="linkbtn" type="button" id="blkbtn">'+(d.blocked?'Unblock this person':'Block this person')+'</button> <span class="muted" id="blkmsg" role="status" aria-live="polite"></span></p>':'')+
      '<h2 style="margin-top:34px">'+((list.length||(d.works||[]).length)?'Published work':'No published work yet')+'</h2>'+
      '<div class="grid" id="wgrid">'+(d.works||[]).map(workTileHTML).join('')+list.map(tileHTML).join('')+'</div>'+
    '</div>';
    hydrateImages(document.getElementById('wgrid'));
    var bb=document.getElementById('blkbtn');
    if(bb) bb.addEventListener('click',function(){
      var msg=document.getElementById('blkmsg');
      if(!d.blocked && !confirm('Block '+d.name+'? You won’t see their comments or work, and they won’t be able to comment on yours. They aren’t told. You can undo this in Account.')) return;
      bb.disabled=true;
      rpc(d.blocked?'unblock_user':'block_user',{p_id:d.id}).then(function(){ if(alive) viewWriter(id); },function(){ bb.disabled=false; if(alive) msg.textContent='Couldn’t do that just now. Try again.'; });
    });
  },function(){ if(alive) missing('Couldn’t load this profile right now. Try again in a moment.'); });
}

/* ---------- router ---------- */
function route(){
  cleanups.forEach(function(f){ try{ f(); }catch(e){} });
  cleanups=[]; setRobots(false);
  var parts=(location.hash||'#/').split('/'), a=parts[1]||'', b=parts.slice(2).join('/');
  var links=document.querySelectorAll('.top nav a');
  for(var i=0;i<links.length;i++){
    if(links[i].getAttribute('data-route')===(a==='artists'?'browse':a)) links[i].setAttribute('aria-current','page');
    else links[i].removeAttribute('aria-current');
  }
  if(a==='write') viewEditor();
  else if(a==='browse') viewBrowse();
  else if(a==='artists') viewArtists();
  else if(a==='piece'){ var id=b; try{ id=decodeURIComponent(b); }catch(e){} viewPiece(id); }
  else if(a==='p'){ var pid=b; try{ pid=decodeURIComponent(b); }catch(e){} viewPublic(pid); }
  else if(a==='make'){ var mid=b; try{ mid=decodeURIComponent(b); }catch(e){} viewMake(mid); }
  else if(a==='m'){ var xid=b; try{ xid=decodeURIComponent(b); }catch(e){} viewWork(xid); }
  else if(a==='w'){ var wid=b; try{ wid=decodeURIComponent(b); }catch(e){} viewWriter(wid); }
  else if(a==='account') viewAccount();
  else if(a==='terms') viewLegal('terms');
  else if(a==='privacy') viewLegal('privacy');
  else if(a==='profile') viewProfile();
  else viewLanding();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',function(){ if(location.hash!=='#/account') arrivalNote=''; route(); });
route();
initAuth();

/* ---------- installable app ---------- */
(function(){
  var bar=document.getElementById('installbar'), btn=document.getElementById('installbtn'), hint=document.getElementById('installhint'), deferred=null;
  var standalone=(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone===true;
  if(standalone) return;
  window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); deferred=e; hint.textContent=''; btn.hidden=false; bar.hidden=false; });
  window.addEventListener('appinstalled',function(){ deferred=null; bar.hidden=true; });
  btn.addEventListener('click',function(){
    if(!deferred) return; var d=deferred; deferred=null; bar.hidden=true;
    try{ d.prompt(); }catch(e){}
  });
  /* iPhone and iPad have no install button, so say how */
  if(/iphone|ipad|ipod/i.test(navigator.userAgent) && !/crios|fxios/i.test(navigator.userAgent)){
    btn.hidden=true; hint.textContent='To install on iPhone or iPad: tap Share, then Add to Home Screen.'; bar.hidden=false;
  }
  if('serviceWorker' in navigator){
    window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  }
})();

})();
</script>
